<app-navigation />

@if (baggingLineService.loading()) {
  <app-loading class="loading" label="Loading machines…" />
} @else if (baggingLineService.error(); as error) {
  <div class="state">
    <p class="state__message state__message--error" role="alert">{{ error }}</p>
    <button class="state__action" type="button" (click)="baggingLineService.reload()">
      Try again
    </button>
  </div>
} @else if (baggingLineService.machines().length === 0) {
  <div class="state">
    <p class="state__message" role="status">No machines are configured for this line.</p>
  </div>
} @else {
  <router-outlet />
}
