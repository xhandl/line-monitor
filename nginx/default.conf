# Hashed bundles (main-XXXXXXXX.js) never change, so they are cached forever.
# index.html carries a per-request CSP nonce and must never be cached, otherwise a cached page
# would hold an old nonce that no longer matches the CSP header.
map $uri $cache_control {
    "~-[\w-]{8}\.(?:js|css)$"  "public, max-age=31536000, immutable";
    "~\.(?:woff2|svg|ico)$"    "public, max-age=604800";
    "~\.html$"                 "no-store";
    default                    "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular writes the placeholder from ngCspNonce (see src/index.html) onto every inline
    # <script>/<style>. nginx swaps it for $request_id, a random value unique to each request.
    sub_filter_once off;
    sub_filter CSP_NONCE $request_id;

    # Headers are only defined here. A location with its own add_header would drop all of them.
    add_header Content-Security-Policy "default-src 'none'; script-src 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types angular" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Enable once the app is served over HTTPS (usually terminated by the load balancer):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;

    # Angular routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A missing file (anything with an extension) is a real 404, not an app route.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }
}
